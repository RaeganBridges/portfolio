<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delight Leader Photoshoot</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8c4ce;
      color: #3d2028;
      min-height: 100vh;
    }
    #gate {
      position: fixed;
      inset: 0;
      background: linear-gradient(145deg, #f8c4ce 0%, #f5aab8 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 1.5rem;
    }
    #gate.hidden {
      display: none;
    }
    #gate h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin: 0 0 0.5rem;
      color: #5c2a38;
    }
    #gate p {
      font-size: 0.9rem;
      color: #6b3a45;
      margin: 0 0 1.5rem;
    }
    #gate form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      max-width: 280px;
    }
    #gate input[type="password"] {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: 1px solid #333;
      border-radius: 8px;
      background: #222;
      color: #fff;
      outline: none;
    }
    #gate input[type="password"]:focus {
      border-color: #555;
    }
    #gate button {
      width: 100%;
      padding: 0.75rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      background: #333;
      color: #fff;
      cursor: pointer;
    }
    #gate button:hover {
      background: #444;
    }
    #gate .error {
      font-size: 0.85rem;
      color: #c44;
      margin: 0;
      min-height: 1.25rem;
    }
    .download-all-btn {
      display: none;
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 50;
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.95);
      color: #222;
      cursor: pointer;
      font-family: inherit;
    }
    body.unlocked .download-all-btn {
      display: block;
    }
    .download-all-btn:hover {
      background: #fff;
    }
    #content {
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    #content h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0 0 1rem;
      color: #5c2a38;
    }
    .gallery-box-wrap {
      position: relative;
      height: 90vh;
      max-height: 90vh;
      border: 3px solid #fff;
      border-radius: 8px;
      overflow: hidden;
    }
    .gallery-box-wrap::before,
    .gallery-box-wrap::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      height: 3rem;
      pointer-events: none;
      z-index: 1;
    }
    .gallery-box-wrap::before {
      top: 0;
      border-radius: 5px 5px 0 0;
      background: linear-gradient(to bottom, #fff 0%, transparent 100%);
    }
    .gallery-box-wrap::after {
      bottom: 0;
      border-radius: 0 0 5px 5px;
      background: linear-gradient(to top, #fff 0%, transparent 100%);
    }
    .gallery-box {
      position: absolute;
      inset: 0;
      border-radius: 6px;
      background: #fff;
      padding: 1rem;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
    }
    .gallery-box img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
      cursor: pointer;
      border-radius: 4px;
    }
    #lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 3rem;
    }
    #lightbox.open {
      display: flex;
    }
    #lightbox-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    #lightbox-download {
      position: absolute;
      top: 1rem;
      right: 5rem;
      z-index: 102;
      padding: 0.5rem 1rem;
      border: none;
      background: rgba(255, 255, 255, 0.9);
      color: #222;
      font-size: 0.9rem;
      cursor: pointer;
      border-radius: 8px;
      font-family: system-ui, sans-serif;
    }
    #lightbox-download:hover {
      background: #fff;
    }
    .lightbox-save-hint {
      margin: 1rem 0 0;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.95);
      text-align: center;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }
    #lightbox-close {
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      z-index: 102;
      width: 44px;
      height: 44px;
      border: none;
      background: rgba(255, 255, 255, 0.9);
      color: #222;
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
    }
    #lightbox-close:hover {
      background: #fff;
    }
    #lightbox-prev,
    #lightbox-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 102;
      width: 48px;
      height: 48px;
      border: none;
      background: rgba(255, 255, 255, 0.9);
      color: #222;
      font-size: 1.5rem;
      cursor: pointer;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      font-family: system-ui, sans-serif;
    }
    #lightbox-prev { left: 1rem; }
    #lightbox-next { right: 1rem; }
    #lightbox-prev:hover,
    #lightbox-next:hover {
      background: #fff;
    }
    #lightbox-img-wrap {
      position: relative;
      z-index: 101;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #lightbox-img-wrap img {
      max-width: 100%;
      max-height: 85vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div id="gate">
    <h1>Delight Leader Photoshoot</h1>
    <p>Enter the password to view this page.</p>
    <form id="gate-form" autocomplete="off">
      <input type="password" id="password" placeholder="Password" required autofocus>
      <button type="submit">Enter</button>
      <p class="error" id="gate-error" role="alert"></p>
    </form>
  </div>

  <button type="button" class="download-all-btn" id="download-all-btn">Save all images</button>

  <main id="content" aria-hidden="true">
    <h1>Delight Leader Photoshoot</h1>
    <div class="gallery-box-wrap">
      <div class="gallery-box" id="gallery-box">
        <!-- filled by JS -->
      </div>
    </div>
  </main>

  <div id="lightbox" aria-hidden="true">
    <div id="lightbox-backdrop"></div>
    <button type="button" id="lightbox-download" aria-label="Save image">Save image</button>
    <button type="button" id="lightbox-close" aria-label="Close">×</button>
    <button type="button" id="lightbox-prev" aria-label="Previous">‹</button>
    <button type="button" id="lightbox-next" aria-label="Next">›</button>
    <div id="lightbox-img-wrap">
      <img id="lightbox-img" src="" alt="">
      <p class="lightbox-save-hint">On your phone, open the image and choose Save to Photos.</p>
    </div>
  </div>

  <script>
    (function () {
      var STORAGE_KEY = 'delight_leader_unlocked';
      var PASSWORD = 'DELIGHT2026';

      var gate = document.getElementById('gate');
      var content = document.getElementById('content');
      var form = document.getElementById('gate-form');
      var input = document.getElementById('password');
      var errorEl = document.getElementById('gate-error');

      function unlock() {
        try {
          sessionStorage.setItem(STORAGE_KEY, '1');
        } catch (e) {}
        document.body.classList.add('unlocked');
        gate.classList.add('hidden');
        content.setAttribute('aria-hidden', 'false');
      }

      function showError(msg) {
        errorEl.textContent = msg;
      }

      if (sessionStorage.getItem(STORAGE_KEY) === '1') {
        unlock();
        return;
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        errorEl.textContent = '';
        if (input.value === PASSWORD) {
          unlock();
        } else {
          showError('Incorrect password. Please try again.');
          input.value = '';
          input.focus();
        }
      });
    })();

    (function () {
      var IMAGES = [
        'images/GIF-1.gif', 'images/IMG-002.png', 'images/IMG-003.png', 'images/IMG-004.png',
        'images/IMG-005.png', 'images/IMG-006.png', 'images/IMG-007.png', 'images/IMG-008.png',
        'images/IMG-009.png', 'images/IMG-010.png', 'images/IMG-011.png', 'images/IMG-012.png',
        'images/IMG-012.5.png', 'images/IMG-013.png', 'images/IMG-014.png', 'images/IMG-015.png',
        'images/IMG-016.png', 'images/IMG-017.png', 'images/IMG-018.png', 'images/IMG-019.png',
        'images/IMG-020.png', 'images/IMG-021.png', 'images/IMG-022.png', 'images/IMG-023.png',
        'images/IMG-024.png', 'images/IMG-025.png', 'images/IMG-026.png', 'images/IMG-027.png',
        'images/IMG-028.png', 'images/IMG-029.png', 'images/IMG-030.png', 'images/IMG-031.png',
        'images/IMG-032.png', 'images/IMG-033.png', 'images/IMG-034.png', 'images/IMG-035.png',
        'images/IMG-036.png'
      ];
      var box = document.getElementById('gallery-box');
      var lightbox = document.getElementById('lightbox');
      var lightboxImg = document.getElementById('lightbox-img');
      var lightboxClose = document.getElementById('lightbox-close');
      var lightboxPrev = document.getElementById('lightbox-prev');
      var lightboxNext = document.getElementById('lightbox-next');
      var backdrop = document.getElementById('lightbox-backdrop');
      var currentIndex = 0;

      IMAGES.forEach(function (src, i) {
        var img = document.createElement('img');
        img.src = src;
        img.alt = 'Photo ' + (i + 1);
        img.dataset.index = i;
        box.appendChild(img);
      });

      function openLightbox(index) {
        currentIndex = index;
        lightboxImg.src = IMAGES[currentIndex];
        lightbox.classList.add('open');
        lightbox.setAttribute('aria-hidden', 'false');
      }
      function closeLightbox() {
        lightbox.classList.remove('open');
        lightbox.setAttribute('aria-hidden', 'true');
      }
      function showPrev() {
        currentIndex = (currentIndex - 1 + IMAGES.length) % IMAGES.length;
        lightboxImg.src = IMAGES[currentIndex];
      }
      function showNext() {
        currentIndex = (currentIndex + 1) % IMAGES.length;
        lightboxImg.src = IMAGES[currentIndex];
      }

      box.addEventListener('click', function (e) {
        if (e.target.tagName === 'IMG' && e.target.dataset.index !== undefined) {
          openLightbox(parseInt(e.target.dataset.index, 10));
        }
      });
      function getFilename(path) {
        return path.split('/').pop();
      }
      async function downloadImage(imageSrc, name) {
        try {
          var response = await fetch(imageSrc);
          var blob = await response.blob();
          var url = URL.createObjectURL(blob);
          var anchor = document.createElement('a');
          anchor.href = url;
          anchor.download = name;
          document.body.appendChild(anchor);
          anchor.click();
          document.body.removeChild(anchor);
          window.URL.revokeObjectURL(url);
        } catch (err) {
          console.error('Error:', err);
        }
      }
      function downloadCurrentImage() {
        var src = IMAGES[currentIndex];
        downloadImage(src, getFilename(src));
      }
      function downloadAll() {
        var delay = 0;
        IMAGES.forEach(function (src) {
          setTimeout(function () {
            downloadImage(src, getFilename(src));
          }, delay);
          delay += 200;
        });
      }

      document.getElementById('lightbox-download').addEventListener('click', downloadCurrentImage);
      document.getElementById('download-all-btn').addEventListener('click', downloadAll);

      lightboxClose.addEventListener('click', closeLightbox);
      backdrop.addEventListener('click', closeLightbox);
      lightboxPrev.addEventListener('click', showPrev);
      lightboxNext.addEventListener('click', showNext);
      document.addEventListener('keydown', function (e) {
        if (!lightbox.classList.contains('open')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') showPrev();
        if (e.key === 'ArrowRight') showNext();
      });
    })();
  </script>
</body>
</html>
