    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #a8e0e0;
      color: #1a4d6d;
      min-height: 100vh;
    }
    #gate {
      position: fixed;
      inset: 0;
      background: linear-gradient(145deg, #a8e0e0 0%, #90d4d4 100%);

      flex-direction: column;
      align-items: center;

      z-index: 10;
      padding: 1.5rem;

    #gate.hidden {
      display: none;
    }
    #gate h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin: 0 0 0.5rem;
      color: #1a4d6d;
      text-align: center;
      width: 100%;
    }
    #gate p {
      font-size: 0.9rem;
      color: #2d5a7b;
      margin: 0 0 1.5rem;
    }
    #gate form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      max-width: 280px;
    }
    #gate input[type="password"] {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: 1px solid #333;
      border-radius: 8px;
      background: #222;
      color: #fff;
      outline: none;
    }
    #gate input[type="password"]:focus {
      border-color: #555;
    }
    #gate button {
      width: 100%;
      padding: 0.75rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      background: #333;
      color: #fff;
      cursor: pointer;
    }
    #gate button:hover {
      background: #444;
    }
    #gate .error {
      font-size: 0.85rem;
      color: #c44;
      margin: 0;
      min-height: 1.25rem;
    }
    .download-all-btn {
      display: none;
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.95);
      color: #222;
      cursor: pointer;
      font-family: inherit;
      margin: 0 0 1rem;
    }
    body.unlocked .download-all-btn {
      display: block;
    }
    .download-all-btn:hover {
      background: #fff;
    }
    #content {
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    .content-header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .actions-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .home-btn {
      padding: 0.4rem 0.8rem;
      font-size: 0.85rem;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.95);
      color: #1a4d6d;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      flex-shrink: 0;
    }
    .home-btn:hover {
      background: #fff;
    }
    .content-header .home-btn {
      justify-self: start;
    }
    .content-header h1 {
      margin: 0;
      text-align: center;
      justify-self: center;
    }
    .content-header .actions-row {
      justify-self: end;
    }
    #content h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #1a4d6d;
    }
    .select-all-btn {
      display: none;
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.95);
      color: #222;
      cursor: pointer;
      font-family: inherit;
      margin: 0 0 1rem;
    }
    .select-all-btn:hover {
      background: #fff;
    }

      #content {
        padding: 1.25rem 1rem;
      }
      .content-header {
        grid-template-columns: 1fr;
      }
      .content-header h1 {
        order: 1;
        font-size: 1.75rem;
        font-weight: 700;
        margin: 0 0 0.75rem;
        color: #1a4d6d;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.3);
      }
      .content-header .home-btn {
        order: 2;
        justify-self: start;
      }
      .content-header .actions-row {
        order: 3;
        justify-self: end;
      }
      .download-all-btn { display: none !important; }

      .content-header .download-all-btn {
        margin: 0;
        flex-shrink: 0;
      }

    .gallery-item {
      position: relative;
      flex: 0 0 auto;
      border-radius: 6px;
      overflow: hidden;
      line-height: 0;
    }
    .gallery-item .selection-checkbox {
      display: none;
      position: absolute;
      top: 0.5rem;
      left: 0.5rem;
      width: 1.5rem;
      height: 1.5rem;
      padding: 0;
      border: 2px solid #fff;
      border-radius: 4px;

      font: inherit;

    .selection-mode .gallery-item .selection-checkbox:hover {
      background: rgba(0, 0, 0, 0.5);
    }
    .selection-mode .gallery-item.selected .selection-checkbox:hover {
      background: rgba(26, 77, 109, 1);
    }
    .selection-mode .gallery-item .selection-checkbox {
      display: block;
    }
    .selection-bar {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 60;
      padding: 0.75rem 1rem;
      background: rgba(26, 77, 109, 0.95);
      color: #fff;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      justify-content: center;
    }
    .selection-bar.open {
      display: flex;
    }
    .selection-bar .save-selected-btn,
    .selection-bar .selection-cancel-btn {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
    }
    .selection-bar .save-selected-btn {
      background: #fff;
      color: #1a4d6d;
    }
    .selection-bar .selection-cancel-btn {
      background: transparent;
      color: #fff;
      text-decoration: underline;
    }
    #save-screen {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 70;
      background: #a8e0e0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    #save-screen.open {
      display: flex;
    }
    #save-screen h2 {

      color: #1a4d6d;
      margin: 0 0 1rem;
      text-align: center;

      max-height: 40vh;
      overflow-y: auto;
      margin-bottom: 1rem;

    #save-screen .save-screen-thumbnails img {

      aspect-ratio: 1;
      object-fit: cover;

    #save-screen .save-screen-actions {

      gap: 0.75rem;

      margin: 0 auto;

      flex-direction: column;
      gap: 6px;
      background: transparent;

      align-items: stretch;
      gap: 6px;
      width: 100%;
      overflow: hidden;
    }

      cursor: pointer;
      border-radius: 6px;
      width: auto;
      height: auto;

      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;

    }

      inset: 0;
      background: rgba(0, 0, 0, 0.4);

      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.95);
      text-align: center;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);

      top: 1rem;
      right: 1.5rem;
      z-index: 102;
      width: 44px;
      height: 44px;
      border: none;
      background: rgba(255, 255, 255, 0.9);
      color: #222;
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
    }
    #lightbox-close:hover {
      background: #fff;
    }
    #lightbox-prev,
    #lightbox-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 102;
      width: 48px;
      height: 48px;
      border: none;
      background: rgba(255, 255, 255, 0.9);
      color: #222;
      font-size: 1.5rem;
      cursor: pointer;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      font-family: system-ui, sans-serif;
    }

    #lightbox-next { right: 1rem; }
    #lightbox-prev:hover,
    #lightbox-next:hover {
      background: #fff;
    }
    #lightbox-img-wrap {
      position: relative;
      z-index: 101;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #lightbox-img-wrap img {
      max-width: 100%;
      max-height: 85vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }

<body>
  <div id="gate">
    <h1>Beach</h1>
    <p>Enter the password to view this page.</p>
    <form id="gate-form" autocomplete="off">
      <input type="password" id="password" placeholder="Password" required autofocus>
      <button type="submit">Enter</button>
      <p class="error" id="gate-error" role="alert"></p>
    </form>
  </div>

  <main id="content" aria-hidden="true">
    <div class="content-header">
      <a href="index.html" class="home-btn">Home</a>
      <h1>Beach</h1>
      <div class="actions-row">
        <button type="button" class="download-all-btn" id="download-all-btn">Download all images</button>
        <button type="button" class="select-all-btn" id="select-all-btn">Select all</button>
      </div>
    </div>
    <div class="gallery-box-wrap">
      <div class="gallery-box" id="gallery-box">
        <!-- filled by JS -->
      </div>
    </div>
  </main>

  <div class="selection-bar" id="selection-bar">
    <span class="selection-count" id="selection-count">0 selected</span>
    <button type="button" class="save-selected-btn" id="save-selected-btn">Download selected</button>
    <button type="button" class="selection-cancel-btn" id="selection-cancel-btn">Cancel</button>
  </div>

  <div id="save-screen" aria-hidden="true">
    <h2 id="save-screen-title">Download zip</h2>
    <div class="save-screen-thumbnails" id="save-screen-thumbnails"></div>
    <p class="lightbox-save-hint" id="save-screen-hint" style="margin:0 0 0.5rem;font-size:0.8rem;">One zip file will download with all selected photos. On your phone, open the zip and save images to Photos.</p>
    <div class="save-screen-actions">
      <button type="button" class="save-screen-download-btn" id="save-screen-download-btn">Download zip</button>
      <button type="button" class="save-screen-back-btn" id="save-screen-back-btn">Back</button>
    </div>
  </div>

  <div id="lightbox" aria-hidden="true">
    <div id="lightbox-backdrop"></div>
    <button type="button" id="lightbox-download" aria-label="Download image">Download image</button>
    <button type="button" id="lightbox-close" aria-label="Close">×</button>
    <button type="button" id="lightbox-prev" aria-label="Previous">‹</button>
    <button type="button" id="lightbox-next" aria-label="Next">›</button>
    <div id="lightbox-img-wrap">
      <img id="lightbox-img" src="" alt="">
      <p class="lightbox-save-hint">On your phone, open the image and choose Save to Photos.</p>
    </div>
  </div>

  <script>
    (function () {
      var STORAGE_KEY = 'beach_unlocked';
      var PASSWORD = 'BEACH2025';

      var gate = document.getElementById('gate');
      var content = document.getElementById('content');
      var form = document.getElementById('gate-form');
      var input = document.getElementById('password');
      var errorEl = document.getElementById('gate-error');

      function unlock() {
        try {
          sessionStorage.setItem(STORAGE_KEY, '1');
        } catch (e) {}
        document.body.classList.add('unlocked');
        gate.classList.add('hidden');
        content.setAttribute('aria-hidden', 'false');
      }

      function showError(msg) {
        errorEl.textContent = msg;
      }

      if (sessionStorage.getItem(STORAGE_KEY) === '1') {
        unlock();
        return;
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        errorEl.textContent = '';
        if (input.value === PASSWORD || input.value === 'BEANS') {
          unlock();
        } else {
          showError('Incorrect password. Please try again.');
          input.value = '';
          input.focus();
        }
      });
    })();

        'beach-images/IMG_9434.heic', 'beach-images/IMG_9442.heic', 'beach-images/IMG_9451.heic', 'beach-images/IMG_9469.heic',

        'beach-images/IMG_9980.heic'
      ];
      var box = document.getElementById('gallery-box');
      var lightbox = document.getElementById('lightbox');
      var lightboxImg = document.getElementById('lightbox-img');
      var lightboxClose = document.getElementById('lightbox-close');
      var lightboxPrev = document.getElementById('lightbox-prev');
      var lightboxNext = document.getElementById('lightbox-next');
      var backdrop = document.getElementById('lightbox-backdrop');
      var currentIndex = 0;

      var selectedIndices = new Set();
      var selectionMode = false;

      initGalleryMosaic(box, IMAGES, function (ordered) {
        IMAGES.length = 0;
        Array.prototype.push.apply(IMAGES, ordered);

      function updateSelectionCount() {
        var n = selectedIndices.size;
        var el = document.getElementById('selection-count');
        if (el) el.textContent = n + ' selected';
      }
      function setSelectionMode(on) {
        selectionMode = on;
        if (on) {
          document.body.classList.add('selection-mode');
          document.getElementById('selection-bar').classList.add('open');
          updateSelectionCount();
        } else {
          document.body.classList.remove('selection-mode');
          document.getElementById('selection-bar').classList.remove('open');
          selectedIndices.clear();
          box.querySelectorAll('.gallery-item').forEach(function (item) {
            item.classList.remove('selected');
          });
        }
      }
      function selectOne(index) {
        if (selectedIndices.has(index)) return;
        selectedIndices.add(index);
        var item = box.querySelector('.gallery-item[data-index="' + index + '"]');
        if (item) item.classList.add('selected');
        updateSelectionCount();
      }
      function selectAll() {
        for (var i = 0; i < IMAGES.length; i++) {
          selectedIndices.add(i);
          var item = box.querySelector('.gallery-item[data-index="' + i + '"]');
          if (item) item.classList.add('selected');
        }
        updateSelectionCount();
        document.body.classList.add('selection-mode');
        document.getElementById('selection-bar').classList.add('open');
      }
      function openSaveScreen() {
        var list = selectedIndices.size ? Array.from(selectedIndices).sort(function (a, b) { return a - b; }) : [];
        if (list.length === 0) return;
        var isMob = window.matchMedia && window.matchMedia('(max-width: 767px)').matches;
        document.getElementById('save-screen-title').textContent = isMob
          ? 'Download ' + list.length + ' photo' + (list.length !== 1 ? 's' : '')
          : 'Download zip of ' + list.length + ' photo' + (list.length !== 1 ? 's' : '');
        var hint = document.getElementById('save-screen-hint');
        var dlBtn = document.getElementById('save-screen-download-btn');
        if (isMob) {
          if (hint) hint.textContent = 'Images will download one by one. Save each to Photos.';
          if (dlBtn) dlBtn.textContent = 'Download images';
        } else {
          if (hint) hint.textContent = 'One zip file will download with all selected photos. On your phone, open the zip and save images to Photos.';
          if (dlBtn) dlBtn.textContent = 'Download zip';
        }
        var thumbWrap = document.getElementById('save-screen-thumbnails');
        thumbWrap.innerHTML = '';
        list.forEach(function (i) {
          var im = document.createElement('img');
          im.src = IMAGES[i];
          im.alt = '';
          thumbWrap.appendChild(im);
        });
        document.getElementById('save-screen').classList.add('open');
        document.getElementById('save-screen').setAttribute('aria-hidden', 'false');
      }
      function closeSaveScreen() {
        document.getElementById('save-screen').classList.remove('open');
        document.getElementById('save-screen').setAttribute('aria-hidden', 'true');
        setSelectionMode(false);
      }
      function isMobile() {
        return window.matchMedia && window.matchMedia('(max-width: 767px)').matches;
      }
      async function downloadSelected() {
        var list = Array.from(selectedIndices).sort(function (a, b) { return a - b; });
        if (list.length === 0) return;
        if (zipDownloadInProgress) return;
        zipDownloadInProgress = true;
        var folderName = 'Beach';
        try {
          if (isMobile()) {
            for (var j = 0; j < list.length; j++) {
              var idx = list[j];
              var src = IMAGES[idx];
              var name = getFilename(src);
              var response = await fetch(src);
              var blob = await response.blob();
              var url = URL.createObjectURL(blob);
              var a = document.createElement('a');
              a.href = url;
              a.download = name;
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              URL.revokeObjectURL(url);
              if (j < list.length - 1) await new Promise(function (r) { setTimeout(r, 250); });
            }
            closeSaveScreen();
          } else {
            var zip = new JSZip();
            for (var j = 0; j < list.length; j++) {
              var idx = list[j];
              var src = IMAGES[idx];
              var name = getFilename(src);
              var response = await fetch(src);
              var blob = await response.blob();
              zip.file(folderName + '/' + name, blob);
            }
            var zipBlob = await zip.generateAsync({ type: 'blob' });
            var url = URL.createObjectURL(zipBlob);
            var a = document.createElement('a');
            a.href = url;
            a.download = folderName + '.zip';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            closeSaveScreen();
          }
        } catch (err) {
          console.error('Download failed:', err);
        } finally {
          zipDownloadInProgress = false;
        }
      }

      document.getElementById('select-all-btn').addEventListener('click', function () {
        selectAll();
      });
      document.getElementById('selection-cancel-btn').addEventListener('click', function () {
        setSelectionMode(false);
      });
      document.getElementById('save-selected-btn').addEventListener('click', function () {
        if (selectedIndices.size === 0) return;
        openSaveScreen();
      });
      document.getElementById('save-screen-download-btn').addEventListener('click', function () {
        downloadSelected();
      });
      document.getElementById('save-screen-back-btn').addEventListener('click', closeSaveScreen);

      function openLightbox(index) {
        currentIndex = index;
        lightboxImg.src = IMAGES[currentIndex];
        lightbox.classList.add('open');
        lightbox.setAttribute('aria-hidden', 'false');
      }
      function closeLightbox() {
        lightbox.classList.remove('open');
        lightbox.setAttribute('aria-hidden', 'true');
      }
      function showPrev() {
        currentIndex = (currentIndex - 1 + IMAGES.length) % IMAGES.length;
        lightboxImg.src = IMAGES[currentIndex];
      }
      function showNext() {
        currentIndex = (currentIndex + 1) % IMAGES.length;
        lightboxImg.src = IMAGES[currentIndex];
      }

      function handleGalleryItemAction(e) {
        var item = e.target.closest && e.target.closest('.gallery-item');
        if (!item) return;
        var index = parseInt(item.getAttribute('data-index'), 10);
        if (isNaN(index)) return;
        if (selectionMode) {
          e.preventDefault();
          e.stopPropagation();
          selectOne(index);
          return;
        }
        if (e.target.tagName === 'IMG') {
          openLightbox(index);
        }
      }
      box.addEventListener('click', handleGalleryItemAction);
      function getFilename(path) {
        return path.split('/').pop();
      }
      var singleDownloadInProgress = false;
      async function downloadImage(imageSrc, name) {
        try {
          var response = await fetch(imageSrc);
          var blob = await response.blob();
          var url = URL.createObjectURL(blob);
          var anchor = document.createElement('a');
          anchor.href = url;
          anchor.download = name;
          document.body.appendChild(anchor);
          anchor.click();
          document.body.removeChild(anchor);
          window.URL.revokeObjectURL(url);
        } catch (err) {
          console.error('Error:', err);
        } finally {
          singleDownloadInProgress = false;
        }
      }
      function downloadCurrentImage() {
        if (singleDownloadInProgress) return;
        singleDownloadInProgress = true;
        var src = IMAGES[currentIndex];
        downloadImage(src, getFilename(src));
      }
      var zipDownloadInProgress = false;
      async function downloadAll() {
        if (zipDownloadInProgress) return;
        zipDownloadInProgress = true;
        var zip = new JSZip();
        var folderName = 'Beach';
        try {
          for (var i = 0; i < IMAGES.length; i++) {
            var src = IMAGES[i];
            var name = getFilename(src);
            var response = await fetch(src);
            var blob = await response.blob();
            zip.file(folderName + '/' + name, blob);
          }
          var zipBlob = await zip.generateAsync({ type: 'blob' });
          var url = URL.createObjectURL(zipBlob);
          var a = document.createElement('a');
          a.href = url;
          a.download = folderName + '.zip';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        } catch (err) {
          console.error('Error creating zip:', err);
        } finally {
          zipDownloadInProgress = false;
        }
      }

      document.getElementById('lightbox-download').addEventListener('click', downloadCurrentImage);
      document.getElementById('download-all-btn').addEventListener('click', downloadAll);

      lightboxClose.addEventListener('click', closeLightbox);
      backdrop.addEventListener('click', closeLightbox);
      lightboxPrev.addEventListener('click', showPrev);
      lightboxNext.addEventListener('click', showNext);
      document.addEventListener('keydown', function (e) {
        if (!lightbox.classList.contains('open')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') showPrev();
        if (e.key === 'ArrowRight') showNext();
      });
      });
    })();
  </script>
